<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BattleShip</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="game.js" defer></script>
  </head>
  <body>
    <div class="header">
      <div class="logo"><h1>BattleShip</h1></div>
    </div>
    <div class="container">
      <div class="player-side">
        <div class="player-header">Friendly Waters</div>
        <div class="player-board"></div>
      </div>
      <div class="opponent-side" -side>
        <div class="opponent-header">Enemy Waters</div>
        <fieldset class="opponent-board"></fieldset>
      </div>
      <div class="boats-setup">
        <div class="boat-header">Place Your Fleet</div>
        <div class="boats-selector">
          <div
            class="ship-container"
            data-length="5"
            data-orientation="horizontal"
            draggable="true"
          >
            <div class="ship-tile" data-segment="0"></div>
            <div class="ship-tile" data-segment="1"></div>
            <div class="ship-tile" data-segment="2"></div>
            <div class="ship-tile" data-segment="3"></div>
            <div class="ship-tile" data-segment="4"></div>
          </div>
          <div
            class="ship-container"
            data-length="4"
            data-orientation="horizontal"
            draggable="true"
          >
            <div class="ship-tile" data-segment="0"></div>
            <div class="ship-tile" data-segment="1"></div>
            <div class="ship-tile" data-segment="2"></div>
            <div class="ship-tile" data-segment="3"></div>
          </div>
          <div
            class="ship-container"
            data-length="3"
            data-orientation="horizontal"
            draggable="true"
          >
            <div class="ship-tile" data-segment="0"></div>
            <div class="ship-tile" data-segment="1"></div>
            <div class="ship-tile" data-segment="2"></div>
          </div>
          <div
            class="ship-container"
            data-length="3"
            data-orientation="horizontal"
            draggable="true"
          >
            <div class="ship-tile" data-segment="0"></div>
            <div class="ship-tile" data-segment="1"></div>
            <div class="ship-tile" data-segment="2"></div>
          </div>
          <div
            class="ship-container"
            data-length="2"
            data-orientation="horizontal"
            draggable="true"
          >
            <div class="ship-tile" data-segment="0"></div>
            <div class="ship-tile" data-segment="1"></div>
          </div>
        </div>
        <div class="button-section">
          <button>Rotate Ships</button>
          <button id="randomize">Randomize Fleet!</button>
        </div>
      </div>
    </div>
    <div id="gameModal" class="modal-overlay">
      <div class="modal-content">
        <h2 id="winnerText">F Wins!</h2>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </body>
</html>
